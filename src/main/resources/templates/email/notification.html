<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Activity</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background-color: #f7f6f3;">
    <div style="padding: 40px 20px;">
        <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #e8e6e1;">
            <!-- Header -->
            <div style="padding: 32px 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e8e6e1;">
                <div style="display: inline-flex; align-items: center; gap: 8px;">
                    <span style="font-size: 22px; font-weight: 800; color: #1a1f36; letter-spacing: -0.5px;">Talent<span style="font-style: italic; color: #e8967a; font-family: Georgia, serif;">Flow</span></span>
                </div>
            </div>

            <!-- Body -->
            <div style="padding: 36px 48px 40px;">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                    <h1 style="font-size: 20px; font-weight: 800; color: #1a1f36; margin: 0; line-height: 1.3; letter-spacing: -0.3px;"
                        th:text="${title}">
                        Notification Title
                    </h1>
                </div>

                <p style="font-size: 15px; color: #6b7280; line-height: 1.7; margin: 0 0 24px;"
                   th:text="${content}">
                    Notification content goes here...
                </p>

                <!-- CTA -->
                <div style="text-align: center;">
                    <a th:href="${ctaLink}"
                        style="display: inline-block; background-color: #1a1f36; color: #ffffff; font-size: 14px; font-weight: 600; padding: 13px 36px; border-radius: 50px; text-decoration: none;"
                        th:text="${ctaText}">
                        View Details
                    </a>
                </div>
            </div>

            <div style="height: 1px; background-color: #e8e6e1; margin: 0 48px;"></div>

            <!-- Footer -->
            <div style="padding: 24px 48px 32px; text-align: center;">
                <p style="font-size: 12px; color: #b5b3ae; margin: 10px 0 0;">
                    © 2026 TalentFlow. All rights reserved.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
